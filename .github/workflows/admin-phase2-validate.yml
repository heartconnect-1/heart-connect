name: Admin Control Plane Validation

on:
  push:
    branches:
      - admin-dashboard-upgrade-2026-09-10
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-admin-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout admin branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce admin branch isolation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin security-stabilization-2026-09-10:refs/remotes/origin/security-stabilization-2026-09-10 --no-tags
          BASE="$(git merge-base HEAD refs/remotes/origin/security-stabilization-2026-09-10)"
          git diff --name-only "$BASE"..HEAD > /tmp/admin-files.txt
          echo "Admin branch files since merge base:"
          cat /tmp/admin-files.txt
          BAD="$(grep -Ev '^(\.github/workflows/admin-[^/]+\.yml|cloudflare/admin-[^/]+\.js|cloudflare/worker-admin-[^/]+\.js|supabase/migrations/[0-9]+_admin_[^/]+\.sql|docs/admin-[^/]+\.md|wrangler\.router\.jsonc)$' /tmp/admin-files.txt || true)"
          if [ -n "$BAD" ]; then
            echo "Unexpected non-admin paths found on the admin branch:"
            echo "$BAD"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check Cloudflare admin module syntax
        run: |
          node --check cloudflare/admin-api-v1.js
          node --check cloudflare/admin-api-v2.js
          node --check cloudflare/admin-api-v2-guard.js
          node --check cloudflare/admin-api-v3.js
          node --check cloudflare/admin-ui-v3.js
          node --check cloudflare/admin-api-v4.js
          node --check cloudflare/admin-ui-v4.js
          node --check cloudflare/admin-api-v5.js
          node --check cloudflare/admin-ui-v5.js
          node --check cloudflare/worker-admin-v5.js
          node --check cloudflare/admin-api-v6.js
          node --check cloudflare/admin-ui-v6.js
          node --check cloudflare/worker-admin-v6.js

      - name: Check Phase 5 safeguards are present
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "adapter_not_implemented" cloudflare/admin-api-v5.js
          grep -Fq "source_key" supabase/migrations/20260910120000_admin_phase5_ai_notifications_automation.sql
          grep -Fq "aiExecutesHighImpactActions:false" cloudflare/admin-api-v5.js
          grep -Fq '"*/5 * * * *"' wrangler.router.jsonc

      - name: Check Phase 6 safeguards are present
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "requiredLaunchChecksCannotBeWaived:true" cloudflare/admin-api-v6.js
          grep -Fq "noAutomaticBans:true" cloudflare/admin-api-v6.js
          grep -Fq "noAutomaticPaymentActions:true" cloudflare/admin-api-v6.js
          grep -Fq "No user bans, verification decisions, payment actions or deletion happen automatically here" cloudflare/admin-ui-v6.js
          grep -Fq "Required launch checks cannot be waived" supabase/migrations/20260910121500_admin_phase6_command_center.sql
          grep -Fq '"main": "cloudflare/worker-admin-v6.js"' wrangler.router.jsonc

      - name: Compile Worker without deploying
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.router.jsonc

  legacy-frontend-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout admin branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript typecheck (informational until AppDeploy client migration completes)
        run: npm run typecheck

      - name: Frontend production build (informational)
        if: always()
        run: npm run build
