name: Deploy Heart Connect to Cloudflare

on:
  workflow_run:
    workflows: ["Build Verification"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure owner access secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEART_CONNECT_OWNER_EMAILS: ${{ secrets.HEART_CONNECT_OWNER_EMAILS }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$HEART_CONNECT_OWNER_EMAILS"
          printf '%s' "$HEART_CONNECT_OWNER_EMAILS" | npx wrangler secret put HEART_CONNECT_OWNER_EMAILS --config wrangler.router.jsonc

      - name: Deploy validated Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.router.jsonc

      - name: Production smoke test
        shell: bash
        run: |
          curl --fail --location --retry 5 --retry-delay 3 --max-time 30             https://royal-heart.com/admin/login             --output /dev/null
