name: Build Verification

on:
  push:
    branches: [main, develop, security-stabilization-2026-09-10]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Scan for committed high-risk secrets
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude='*.md' '(sk_live_[A-Za-z0-9]{16,}|sk_test_[A-Za-z0-9]{16,}|github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|sb_secret_[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .; then
            echo 'Potential committed secret detected.'
            exit 1
          fi
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Add AppDeploy CI shim
        run: |
          mkdir -p node_modules/@appdeploy/client
          cat > node_modules/@appdeploy/client/package.json <<'EOF'
          {"name":"@appdeploy/client","version":"0.0.0-ci","type":"module","exports":"./index.js","types":"./index.d.ts"}
          EOF
          cat > node_modules/@appdeploy/client/index.js <<'EOF'
          export const auth = {};
          export const api = {};
          export const ws = {};
          EOF
          cat > node_modules/@appdeploy/client/index.d.ts <<'EOF'
          export type ApiResponse<T = any> = { data: T };
          export interface ApiClient {
            get<T = any>(path: string): Promise<ApiResponse<T>>;
            post<T = any>(path: string, body?: any): Promise<ApiResponse<T>>;
            put<T = any>(path: string, body?: any): Promise<ApiResponse<T>>;
            delete<T = any>(path: string): Promise<ApiResponse<T>>;
          }
          export interface AuthClient {
            getUser(): Promise<any>;
            signIn(...args: any[]): Promise<any>;
            signOut(...args: any[]): Promise<any>;
          }
          export interface WsConnection {
            connectionId?: string;
            ready: Promise<void>;
            onMessage(cb: (message: any) => void): void;
            onError(cb: (error: any) => void): void;
            onClose(cb: () => void): void;
            disconnect(): void;
          }
          export const api: ApiClient;
          export const auth: AuthClient;
          export const ws: { connect(...args: any[]): WsConnection };
          EOF
      - name: TypeScript
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Validate current Admin hardening modules
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare/admin-auth-v2.js
          node --check cloudflare/admin-api-v51.js
          node --check cloudflare/admin-ui-v50.js
          node --check cloudflare/worker-admin-v7.js
          grep -Fq "SameSite=Strict" cloudflare/admin-auth-v2.js
          grep -Fq "HttpOnly" cloudflare/admin-auth-v2.js
          grep -Fq "browserSessionOnly:true" cloudflare/admin-auth-v2.js
          grep -Fq "Path=/; Secure; HttpOnly; SameSite=Strict; Priority=High" cloudflare/admin-auth-v2.js
          grep -Fq "validateAdminSession" cloudflare/worker-admin-v7.js
          grep -Fq "cloudflare-admin-router-v51-browser-session-login" cloudflare/worker-admin-v7.js
          grep -Fq "admin-api-v51.js" cloudflare/worker-admin-v7.js

      - name: Validate Cloudflare Worker
        run: npx wrangler deploy --dry-run --config wrangler.router.jsonc
      - name: Deploy Cloudflare Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.router.jsonc
      - name: Configure owner access
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HEART_CONNECT_OWNER_EMAILS: ${{ secrets.HEART_CONNECT_OWNER_EMAILS }}
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$HEART_CONNECT_OWNER_EMAILS"
          printf '%s' "$HEART_CONNECT_OWNER_EMAILS" | npx wrangler secret put HEART_CONNECT_OWNER_EMAILS --config wrangler.router.jsonc
      - name: Smoke test production admin security
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail

          LOGIN_STATUS="$(curl -sS --retry 5 --retry-delay 3 --max-time 30 \
            -D /tmp/hc-login-headers.txt -o /dev/null -w '%{http_code}' \
            https://royal-heart.com/admin/login)"
          echo "admin/login => $LOGIN_STATUS"
          test "$LOGIN_STATUS" = "200"
          grep -qi '^cache-control:.*no-store' /tmp/hc-login-headers.txt
          grep -qi '^x-heart-connect-admin-router: cloudflare-admin-router-v50-security-hardened' /tmp/hc-login-headers.txt

          ADMIN_STATUS="$(curl -sS --max-time 30 \
            -D /tmp/hc-admin-headers.txt -o /dev/null -w '%{http_code}' \
            https://royal-heart.com/admin)"
          echo "admin => $ADMIN_STATUS"
          test "$ADMIN_STATUS" = "302"
          grep -qi '^location:.*\/admin\/login' /tmp/hc-admin-headers.txt

          SESSION_STATUS="$(curl -sS --max-time 30 \
            -o /dev/null -w '%{http_code}' \
            https://royal-heart.com/api/_cf/auth/session)"
          echo "auth/session => $SESSION_STATUS"
          test "$SESSION_STATUS" = "401"

          CAP_STATUS="$(curl -sS --max-time 30 \
            -o /dev/null -w '%{http_code}' \
            https://royal-heart.com/api/admin/capabilities)"
          echo "admin/capabilities => $CAP_STATUS"
          case "$CAP_STATUS" in
            401|403) ;;
            *) echo "Expected unauthenticated Admin API denial, got $CAP_STATUS"; exit 1 ;;
          esac
