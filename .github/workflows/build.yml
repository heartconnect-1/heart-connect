name: Build Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Add AppDeploy CI shim
        run: |
          mkdir -p node_modules/@appdeploy/client
          printf '%s\n' '{"name":"@appdeploy/client","version":"0.0.0-ci","type":"module","exports":"./index.js"}' > node_modules/@appdeploy/client/package.json
          printf '%s\n' 'export const auth = {};' 'export const api = {};' 'export const ws = {};' > node_modules/@appdeploy/client/index.js
      - name: Build
        run: npm run build
