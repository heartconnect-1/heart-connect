name: Build Verification

on:
  push:
    branches: [main, develop, security-stabilization-2026-09-10]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Add AppDeploy CI shim
        run: |
          mkdir -p node_modules/@appdeploy/client
          printf '%s\n' '{"name":"@appdeploy/client","version":"0.0.0-ci","type":"module","exports":"./index.js","types":"./index.d.ts"}' > node_modules/@appdeploy/client/package.json
          printf '%s\n' 'export const auth = {};' 'export const api = {};' 'export const ws = {};' > node_modules/@appdeploy/client/index.js
          printf '%s\n' 'export const auth: any;' 'export const api: any;' 'export const ws: any;' > node_modules/@appdeploy/client/index.d.ts
      - name: TypeScript diagnostics
        id: typecheck
        continue-on-error: true
        run: |
          npm run typecheck 2>&1 | tee typecheck-errors.txt
          test ${PIPESTATUS[0]} -eq 0
      - name: Upload TypeScript diagnostics
        if: steps.typecheck.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-errors
          path: typecheck-errors.txt
          retention-days: 3
      - name: Build
        run: npm run build
      - name: Validate Cloudflare Worker
        run: npx wrangler deploy --dry-run --config wrangler.router.jsonc
