name: HeartConnect Brand Preview

on:
  push:
    branches:
      - "brand/heartconnect-logo-2026-10-06"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Create isolated preview config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('wrangler.router.jsonc', 'utf8'));
          delete config.routes;
          delete config.triggers;
          config.name = `heart-connect-brand-preview-${process.env.GITHUB_RUN_ID}`;
          config.workers_dev = true;
          config.preview_urls = true;
          fs.writeFileSync('wrangler.preview.jsonc', JSON.stringify(config, null, 2));
          NODE

      - name: Deploy isolated Cloudflare preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler deploy --config wrangler.preview.jsonc | tee /tmp/wrangler-preview.log
          PREVIEW_URL="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' /tmp/wrangler-preview.log | tail -1 || true)"
          if [ -z "$PREVIEW_URL" ]; then
            PREVIEW_URL="$(grep -Eo 'https://[^ ]+\.workers\.dev' /tmp/wrangler-preview.log | tail -1 || true)"
          fi
          test -n "$PREVIEW_URL"
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          echo "Preview URL: $PREVIEW_URL"

      - name: Preview smoke test
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          STATUS="$(curl --compressed -sS --retry 5 --retry-delay 2 --max-time 30 -o /tmp/hc-preview.html -w '%{http_code}' "$PREVIEW_URL/")"
          echo "preview / => $STATUS"
          test "$STATUS" = "200"
          grep -qi '<div id="root"' /tmp/hc-preview.html

      - name: Publish preview URL
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          {
            echo "## HeartConnect brand preview"
            echo
            echo "Preview: $PREVIEW_URL"
            echo
            echo "This is an isolated Cloudflare Workers preview. It does not use the production royal-heart.com route."
          } >> "$GITHUB_STEP_SUMMARY"
